[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:nouveau]
command=java -jar /opt/couchdb/nouveau/lib/nouveau-1.0-SNAPSHOT.jar server /opt/couchdb/etc/nouveau.yaml
user=couchdb
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:couchdb]
command=/opt/couchdb/couchdb-wrapper.sh
user=couchdb
priority=20
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
