maxIndexesOpen: 3000
commitIntervalSeconds: 30
idleSeconds: 60
rootDir: /opt/couchdb/data/nouveau

logging:
  level: INFO

server:
  applicationConnectors:
    - type: h2c
      bindHost: 127.0.0.1
      port: 5987
      useDateHeader: false
  adminConnectors:
    - type: h2c
      bindHost: 127.0.0.1
      port: 5988
      useDateHeader: false
  gzip:
    includedMethods:
      - GET
      - POST
  requestLog:
    appenders:
      - type: console
        target: stderr