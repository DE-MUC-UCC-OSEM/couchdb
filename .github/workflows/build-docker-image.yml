name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      release:
        type: string
        required: true
        description: 'Internal release version counter'
        default: '0'
      erlang:
        type: string
        required: true
        description: 'Erlang OTP version'
        default: '27.3.4.19'
      couchdb:
        type: string
        required: true
        description: 'CouchDB version'
        default: '3.5.3'
      fauxton:
        type: string
        required: true
        description: 'CouchDB Fauxton version'
        default: '1.3.7'
      create_release:
        type: boolean
        required: false
        description: 'Create an official GitHub release (incl. git tag) after a successful build'
        default: false

jobs:
  build_and_push:
    name: Push image to Github Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Log in to Artifactory Container Registry
        uses: docker/login-action@v4
        with:
          registry: artifactory.mitel.com
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Prepare Dockerfile
        env:
          COUCHDB_VERSION: ${{ github.event.inputs.couchdb }}
          RELEASE_VERSION: ${{ github.event.inputs.release }}
          ERLANG_VERSION: ${{ github.event.inputs.erlang }}
          FAUXTON_VERSION: ${{ github.event.inputs.fauxton }}
        run: |
          export CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          sed -i -e "s/__COUCHDB_VERSION__/$COUCHDB_VERSION/" ${{ github.workspace }}/Dockerfile
          sed -i -e "s/__RELEASE_VERSION__/$RELEASE_VERSION/" ${{ github.workspace }}/Dockerfile
          sed -i -e "s/__ERLANG_OTP_VERSION__/$ERLANG_VERSION/" ${{ github.workspace }}/Dockerfile
          sed -i -e "s/__FAUXTON_VERSION__/$FAUXTON_VERSION/" ${{ github.workspace }}/Dockerfile
          sed -i -e "s/__CURRENT_TIME__/$CURRENT_TIME/" ${{ github.workspace }}/Dockerfile

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.ARTIFACTORY_IMG_URL_PUBLIC }}/couchdb
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.inputs.couchdb }}-r${{ github.event.inputs.release }}-tumbleweed

      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          build-args: |
            ERLANG_OTP_VERSION=${{ github.event.inputs.erlang }}
            COUCHDB_VERSION=${{ github.event.inputs.couchdb }}
            FAUXTON_VERSION=${{ github.event.inputs.fauxton }}
            RELEASE_VERSION=${{ github.event.inputs.release }}
            MEND_EMAIL=${{ secrets.MEND_EMAIL }}
            MEND_ORGANIZATION=${{ secrets.MEND_ORGANIZATION }}
            MEND_URL=${{ secrets.MEND_URL }}
            MEND_USER_KEY=${{ secrets.MEND_USER_KEY }}
          push: false
          load: true
          tags: couchdb:ci-test

      # The runtime image has no shell tools and no erl. The tests run erl,
      # bash and coreutils in sidecar containers of the app stage (cached).
      - name: Build tools image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          target: app
          build-args: |
            ERLANG_OTP_VERSION=${{ github.event.inputs.erlang }}
            COUCHDB_VERSION=${{ github.event.inputs.couchdb }}
            FAUXTON_VERSION=${{ github.event.inputs.fauxton }}
            RELEASE_VERSION=${{ github.event.inputs.release }}
            MEND_EMAIL=${{ secrets.MEND_EMAIL }}
            MEND_ORGANIZATION=${{ secrets.MEND_ORGANIZATION }}
            MEND_URL=${{ secrets.MEND_URL }}
            MEND_USER_KEY=${{ secrets.MEND_USER_KEY }}
          push: false
          load: true
          tags: couchdb:ci-tools

      - name: Test image (content, user, JavaScript, restart, cookie)
        run: |
          bash ${{ github.workspace }}/test-image.sh couchdb:ci-test couchdb:ci-tools
          SIZE=$(docker image inspect couchdb:ci-test --format '{{.Size}}')
          echo "Image size: $((SIZE / 1024 / 1024)) MB (uncompressed)" | tee -a $GITHUB_STEP_SUMMARY

      - name: Test logging (errors to stderr, everything else to stdout)
        run: bash ${{ github.workspace }}/test-logging.sh couchdb:ci-test couchdb:ci-tools

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          build-args: |
            ERLANG_OTP_VERSION=${{ github.event.inputs.erlang }}
            COUCHDB_VERSION=${{ github.event.inputs.couchdb }}
            FAUXTON_VERSION=${{ github.event.inputs.fauxton }}
            RELEASE_VERSION=${{ github.event.inputs.release }}
            MEND_EMAIL=${{ secrets.MEND_EMAIL }}
            MEND_ORGANIZATION=${{ secrets.MEND_ORGANIZATION }}
            MEND_URL=${{ secrets.MEND_URL }}
            MEND_USER_KEY=${{ secrets.MEND_USER_KEY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan Docker Image
        if: ${{ success() }}
        env:
          IMAGE: ${{ vars.ARTIFACTORY_IMG_URL_PUBLIC }}/couchdb:${{ github.event.inputs.couchdb }}-r${{ github.event.inputs.release }}-tumbleweed
          COUCHDB_VERSION: ${{ github.event.inputs.couchdb }}
          RELEASE_VERSION: ${{ github.event.inputs.release }}
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_ORGANIZATION: ${{ secrets.MEND_ORGANIZATION }}
          MEND_URL: ${{ secrets.MEND_URL }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
        run: |
          rm -f ${{ github.workspace }}/mend
          curl https://downloads.mend.io/cli/linux_amd64/mend -o ${{ github.workspace }}/mend && chmod +x ${{ github.workspace }}/mend
          ${{ github.workspace }}/mend image ${IMAGE,,} -s "OpenScape UC Portfolio//OSEM third party applications//couchdb-osem-docker-image - $COUCHDB_VERSION-r$RELEASE_VERSION-tumbleweed"

      - name: Create build summary
        if: ${{ success() }}
        env:
          COUCHDB_VERSION: ${{ github.event.inputs.couchdb }}
          ERLANG_VERSION: ${{ github.event.inputs.erlang }}
          FAUXTON_VERSION: ${{ github.event.inputs.fauxton }}
          IMAGE: ${{ vars.ARTIFACTORY_IMG_URL_PUBLIC }}/couchdb:${{ github.event.inputs.couchdb }}-r${{ github.event.inputs.release }}-tumbleweed
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          {
            echo "# Apache CouchDB"
            echo ""
            echo "Build with Erlang OTP and QuickJS enabled by default. Running in an openSUSE Tumbleweed Image."
            echo ""
            echo "${IMAGE}"
            echo ""
            echo "### Included versions"
            echo ""
            echo "| Package Name              | Version         |"
            echo "|---------------------------|-----------------|"
            echo "| Apache CouchDB | $COUCHDB_VERSION |"
            echo "| Erlang OTP | $ERLANG_VERSION |"
            echo "| Fauxton | $FAUXTON_VERSION |"
            echo ""
            if [ "$CREATE_RELEASE" = "true" ]; then
              echo "GitHub release: created"
            else
              echo "GitHub release: skipped (image pushed to registries only, no tag created)"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub release
        if: ${{ success() && inputs.create_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUCHDB_VERSION: ${{ github.event.inputs.couchdb }}
          ERLANG_VERSION: ${{ github.event.inputs.erlang }}
          FAUXTON_VERSION: ${{ github.event.inputs.fauxton }}
          RELEASE_VERSION: ${{ github.event.inputs.release }}
          IMAGE: ${{ vars.ARTIFACTORY_IMG_URL_PUBLIC }}/couchdb:${{ github.event.inputs.couchdb }}-r${{ github.event.inputs.release }}-tumbleweed
        run: |
          cat > ${{ github.workspace }}/release-notes.md <<EOF
          ## CouchDB release ${{ github.event.inputs.couchdb }}-${{ github.event.inputs.release }}
          - **CouchDB version**: $COUCHDB_VERSION
          - **Erlang OTP version**: $ERLANG_VERSION
          - **Fauxton version**: $FAUXTON_VERSION
          ```
          docker pull ${IMAGE}
          ```

          EOF
          gh release create "$COUCHDB_VERSION-r$RELEASE_VERSION-tumbleweed" \
              --repo="$GITHUB_REPOSITORY" \
              --target="$GITHUB_SHA" \
              --title="$COUCHDB_VERSION-r$RELEASE_VERSION-tumbleweed" \
              --notes-file release-notes.md

      - name: Cleanup environment
        if: ${{ always() }}
        run: |
          git clean -ffdx
